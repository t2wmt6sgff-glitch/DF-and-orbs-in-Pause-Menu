name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: iOS
          combine: false
          bindings-ref: 7431f0cf02fac40e6fa04faf30a7e248a6fee60d

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v7
        with:
          name: DF-and-orbs-in-Pause-Menu-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
