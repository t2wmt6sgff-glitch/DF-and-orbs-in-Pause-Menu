name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Geode mod
        id: build
        # Keep the exact build action revision used by successful Build #16.
        uses: geode-sdk/build-geode-mod@963ac394ad1773b6ea5b0f96aade52a44c6a4770
        with:
          sdk: given
          target: iOS
          combine: false
          # Explicit 2.2081 iOS bindings ported from the 2.2074 mobile bindings.
          bindings-ref: 9dce9b95f7b60b914f6ddb91b414849b060e87a2

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v7
        with:
          name: DF-and-orbs-in-Pause-Menu-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
