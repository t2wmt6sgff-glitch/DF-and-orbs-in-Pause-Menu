name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Geode mod
        id: build
        # Pin to the exact build action revision used by successful Build #6.
        uses: geode-sdk/build-geode-mod@963ac394ad1773b6ea5b0f96aade52a44c6a4770
        with:
          sdk: given
          target: iOS
          combine: false
          bindings-ref: e7ce86056847b2efca814574c619cc0ecf76c39d

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v7
        with:
          name: DF-and-orbs-in-Pause-Menu-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
